services:
  - type: web
    name: gitbot-automation
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        value: Ov23liUhQksuY0auNkpl
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
